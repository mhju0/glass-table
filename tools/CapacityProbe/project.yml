name: GlassTableCapacityProbe
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  GlassTableDrills:
    path: ../../GlassTableDrills
targets:
  GlassTableCapacityProbe:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: GlassTableDrills
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelju.glasstable.capacityprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Capacity Probe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
