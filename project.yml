name: GlassTable
options:
  developmentLanguage: ko
  bundleIdPrefix: com.michaelju.glasstable
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GlassTableEngine:
    path: GlassTableEngine
  GlassTableDrills:
    path: GlassTableDrills
targets:
  GlassTable:
    type: application
    platform: iOS
    sources:
      - GlassTable/Sources
      - GlassTable/Resources
    dependencies:
      - package: GlassTableDrills
      - package: GlassTableEngine
    info:
      path: GlassTable/Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko, en]
        CFBundleDisplayName: Glass Table
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        # Drill layout (green zone + bottom sheet) is portrait-designed; lock it.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelju.glasstable
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    scheme:
      testTargets:
        - GlassTableTests
        - GlassTableUITests
  GlassTableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GlassTable/Tests
    dependencies:
      - target: GlassTable
      - package: GlassTableDrills
      - package: GlassTableEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
  GlassTableUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GlassTable/UITests
    dependencies:
      - target: GlassTable
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: GlassTable
schemes:
  GlassTableReleaseSmoke:
    build:
      targets:
        GlassTable: all
        GlassTableUITests: [test]
    test:
      config: Release
      targets:
        - GlassTableUITests
