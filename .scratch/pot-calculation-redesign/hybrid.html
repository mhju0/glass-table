<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Table 팟 계산 하이브리드 모형</title>
  <style>
    @font-face { font-family: Pretendard; src: url("../../GlassTable/Resources/Pretendard-Regular.otf") format("opentype"); font-weight: 400; }
    @font-face { font-family: Pretendard; src: url("../../GlassTable/Resources/Pretendard-SemiBold.otf") format("opentype"); font-weight: 600; }
    @font-face { font-family: Pretendard; src: url("../../GlassTable/Resources/Pretendard-Bold.otf") format("opentype"); font-weight: 700; }
    :root,
    [data-palette="charcoal"] {
      color-scheme:dark;
      --page-bg:#17191c; --panel-bg:#24272b; --table-bg:#153d33; --seat-bg:#2b2e32; --field-bg:#1d2024; --pot-bg:#102a23;
      --text-primary:#f4f0e6; --text-muted:#bfc3c8; --accent:#edc17f; --accent-on:#241b0e;
      --border:#757a81; --border-strong:#989da4; --track:#555a61; --track-past:#8b9096;
      --success:#83c9a4; --error:#f0a39a; --chip-edge:#73592f; --overlay:rgba(8,9,10,.78); --shadow:rgba(0,0,0,.38);
    }
    [data-palette="slate"] {
      color-scheme:dark;
      --page-bg:#151b27; --panel-bg:#232c3d; --table-bg:#243b4a; --seat-bg:#303c4e; --field-bg:#1b2433; --pot-bg:#192e3b;
      --text-primary:#f0f4fa; --text-muted:#c4ccd8; --accent:#a3cbf7; --accent-on:#101825;
      --border:#7889a2; --border-strong:#9babc1; --track:#59677b; --track-past:#8c9aaf;
      --success:#88d0b1; --error:#f0aaa3; --chip-edge:#4f7193; --overlay:rgba(8,12,20,.78); --shadow:rgba(0,0,0,.4);
    }
    [data-palette="paper"] {
      color-scheme:light;
      --page-bg:#f2eee5; --panel-bg:#e7e1d6; --table-bg:#dce5df; --seat-bg:#fffdf7; --field-bg:#e9e4da; --pot-bg:#cbd8d0;
      --text-primary:#222c29; --text-muted:#515e58; --accent:#275b4c; --accent-on:#fffdf7;
      --border:#748079; --border-strong:#53615a; --track:#a5afa9; --track-past:#68756f;
      --success:#236b49; --error:#9b332d; --chip-edge:#173d32; --overlay:rgba(34,44,41,.7); --shadow:rgba(41,48,44,.2);
    }
    * { box-sizing: border-box; }
    html, body { min-height:100%; margin:0; background:var(--page-bg); color:var(--text-primary); font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font:inherit; }
    button:focus-visible, summary:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    button:active { transform:scale(.985); }
    .review-shell { min-height:100dvh; display:grid; grid-template-columns:375px minmax(270px,330px); align-items:start; justify-content:center; gap:40px; padding:34px 22px 60px; background:var(--page-bg); color:var(--text-primary); }
    .phone { width:375px; min-height:812px; border:1px solid var(--border); border-radius:38px; background:var(--page-bg); overflow:clip; box-shadow:0 24px 60px var(--shadow); }
    .app { min-height:812px; display:flex; flex-direction:column; }
    .app-header { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; padding:18px 16px 9px; }
    .header-center { min-width:0; text-align:center; }
    .kicker { margin:0 0 3px; color:var(--text-muted); font-size:.73rem; font-weight:600; }
    h1 { margin:0; font-size:1.08rem; line-height:1.25; }
    .icon-button { width:44px; height:44px; border:1px solid var(--border); border-radius:50%; background:var(--panel-bg); color:var(--text-primary); cursor:pointer; font-weight:700; }
    .icon-button[hidden] { visibility:hidden; }
    .lesson { flex:1; padding:9px 17px 28px; }
    .intro { padding-top:24px; }
    .intro h2, .question-title { margin:0; font-size:clamp(1.45rem,6vw,1.88rem); line-height:1.28; letter-spacing:-.025em; }
    .intro > p { margin:13px 0 0; color:var(--text-muted); line-height:1.65; }
    .how { margin:25px 0 22px; padding:16px; border:1px solid var(--border); border-radius:15px; background:var(--panel-bg); }
    .how strong { display:block; margin-bottom:7px; }
    .how p { margin:0; color:var(--text-muted); font-size:.9rem; line-height:1.55; }
    .primary, .secondary, .text-button { width:100%; min-height:50px; border-radius:13px; cursor:pointer; font-weight:700; }
    .primary { border:0; background:var(--accent); color:var(--accent-on); }
    .secondary { border:1px solid var(--border-strong); background:transparent; color:var(--text-primary); }
    .text-button { min-height:44px; margin-top:6px; border:0; background:transparent; color:var(--text-muted); }
    .progress { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; color:var(--text-muted); font-size:.76rem; }
    .question-title { margin-bottom:10px; text-align:left; }

    .table { padding:12px; border:2px solid var(--border-strong); border-radius:24px; background:var(--table-bg); }
    .perimeter { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; align-items:stretch; }
    .seat { position:relative; min-width:0; padding:9px; border:1px solid var(--border); border-radius:11px; background:var(--seat-bg); }
    .seat[data-active="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .seat-order { display:inline-grid; place-items:center; width:22px; height:22px; margin-right:5px; border-radius:50%; background:var(--field-bg); color:var(--text-muted); font-size:.68rem; }
    .seat-name { font-size:.86rem; font-weight:700; }
    .seat-role { display:block; min-height:1.2em; margin:4px 0 7px; color:var(--text-muted); font-size:.64rem; line-height:1.35; }
    .seat-action { min-height:2.9em; margin:7px 0 0; color:var(--text-muted); font-size:.8rem; font-weight:600; line-height:1.4; }
    .seat[data-active="true"] .seat-action { color:var(--accent); }
    .tray { display:flex; align-items:flex-end; justify-content:space-between; gap:6px; padding-top:7px; border-top:1px solid var(--border); }
    .tray-label { color:var(--text-muted); font-size:.68rem; }
    .tray-total { white-space:nowrap; font-size:1.34rem; font-weight:700; }
    .pot-zone { grid-column:1 / -1; grid-row:2; align-self:center; margin:0; padding:10px 8px; border-radius:12px; background:var(--pot-bg); text-align:center; }
    .pot-zone span { display:block; color:var(--text-muted); font-size:.68rem; }
    .pot-zone strong { display:block; margin-top:2px; font-size:1.25rem; }
    .timeline { margin-top:12px; }
    .timeline-track { display:flex; justify-content:center; gap:6px; margin:0 0 10px; }
    .timeline-track i { flex:1; height:4px; border-radius:2px; background:var(--track); }
    .timeline-track i.past { background:var(--track-past); }
    .timeline-track i.current { background:var(--accent); }
    .timeline-controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .timeline-controls button { min-height:48px; border:1px solid var(--border-strong); border-radius:11px; background:var(--panel-bg); color:var(--text-primary); cursor:pointer; }
    .timeline-controls button:disabled { opacity:.42; cursor:not-allowed; }
    .motion-chip { position:fixed; z-index:30; width:20px; height:10px; border:2px solid var(--chip-edge); border-radius:50%; background:var(--accent); pointer-events:none; }
    .choices { display:grid; gap:9px; margin:16px 0 13px; }
    .choice { min-height:54px; display:flex; align-items:center; justify-content:space-between; padding:10px 15px; border:1px solid var(--border-strong); border-radius:12px; background:var(--seat-bg); color:var(--text-primary); cursor:pointer; }
    .choice strong { font-size:1.12rem; }
    .choice-mark { width:20px; height:20px; border:2px solid var(--border-strong); border-radius:50%; }
    .choice[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .choice[aria-pressed="true"] .choice-mark { border:6px solid var(--accent); }
    .choice:disabled:not([aria-pressed="true"]) { opacity:.58; }
    .confirm:disabled { opacity:.45; cursor:not-allowed; }
    .feedback { margin:16px 0 12px; padding:15px; border:1px solid var(--border); border-radius:13px; background:var(--panel-bg); }
    .feedback h3 { margin:0 0 7px; font-size:1rem; }
    .feedback h3.correct { color:var(--success); }
    .feedback h3.wrong { color:var(--error); }
    .feedback p { margin:0; color:var(--text-muted); font-size:.88rem; line-height:1.55; }
    .calculation { margin-top:10px; border-top:1px solid var(--border); }
    .calculation summary { min-height:44px; display:flex; align-items:center; color:var(--text-primary); cursor:pointer; font-weight:600; }
    .calculation p { margin:0 0 4px; color:var(--text-primary); font-weight:600; }
    .result-actions { display:grid; gap:9px; margin-top:10px; }

    .review-panel { position:sticky; top:24px; padding:17px; border:1px solid var(--border); border-radius:16px; background:var(--panel-bg); }
    .study-label { margin:0 0 6px; color:var(--accent); font-size:11px; font-weight:700; }
    .review-panel h2 { margin:0 0 8px; font-size:1.25rem; }
    .review-panel > p { margin:0 0 16px; color:var(--text-muted); font-size:.85rem; line-height:1.55; }
    .control-group { margin-top:16px; }
    .control-group > span { display:block; margin-bottom:7px; color:var(--text-muted); font-size:.72rem; }
    .segmented { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
    .segmented button, .review-action, .palette-choice { min-height:44px; border:1px solid var(--border-strong); border-radius:9px; background:var(--field-bg); color:var(--text-primary); cursor:pointer; }
    .segmented button[aria-pressed="true"], .palette-choice[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .review-list { display:grid; gap:7px; }
    .review-action { width:100%; padding:0 11px; text-align:left; }
    .palette-grid { display:grid; gap:7px; }
    .palette-choice { width:100%; display:flex; align-items:center; gap:9px; padding:7px 10px; text-align:left; }
    .palette-choice[data-review-palette="charcoal"] { --swatch-bg:#17191c; --swatch-accent:#edc17f; }
    .palette-choice[data-review-palette="slate"] { --swatch-bg:#151b27; --swatch-accent:#a3cbf7; }
    .palette-choice[data-review-palette="paper"] { --swatch-bg:#f2eee5; --swatch-accent:#275b4c; }
    .palette-swatches { display:flex; flex:0 0 auto; overflow:hidden; width:34px; height:22px; border:1px solid var(--border-strong); border-radius:6px; }
    .palette-swatches i { width:50%; background:var(--swatch-bg); }
    .palette-swatches i + i { background:var(--swatch-accent); }
    .palette-copy { min-width:0; }
    .palette-copy strong, .palette-copy small { display:block; }
    .palette-copy small { margin-top:2px; color:var(--text-muted); font-size:.65rem; }
    .help-backdrop { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:22px; background:var(--overlay); }
    .help { width:min(335px,100%); padding:20px; border:1px solid var(--border-strong); border-radius:17px; background:var(--panel-bg); box-shadow:0 16px 44px var(--shadow); }
    .help h2 { margin:0 0 9px; font-size:1.2rem; }
    .help p { margin:0 0 16px; color:var(--text-muted); line-height:1.6; }
    html:has(.scale-200) { font-size:200%; }
    .scale-200 .phone { width:375px; }
    .perimeter [data-seat="SB"] { grid-column:1; grid-row:1; }
    .perimeter [data-seat="BB"] { grid-column:2; grid-row:1; }
    .perimeter[data-count="3"] [data-seat="BTN"] { grid-column:1 / -1; grid-row:3; }
    .perimeter[data-count="4"] [data-seat="BTN"] { grid-column:1; grid-row:3; }
    .perimeter[data-count="4"] [data-seat="UTG"] { grid-column:2; grid-row:3; }
    .scale-200 .perimeter { grid-template-columns:1fr; grid-template-rows:auto; }
    .scale-200 .perimeter .seat, .scale-200 .perimeter .pot-zone { grid-column:1!important; grid-row:auto!important; }
    .scale-200 .perimeter .pot-zone { order:99; }
    .scale-200 .timeline-controls { grid-template-columns:1fr; }
    .scale-200 .timeline-controls button { width:100%; }
    @media (max-width:780px) {
      .review-shell { display:flex; flex-direction:column; align-items:center; gap:0; padding:0; background:var(--page-bg); }
      .phone { width:100%; min-height:100dvh; border:0; border-radius:0; box-shadow:none; overflow:visible; }
      .app { min-height:100dvh; }
      .review-panel { position:static; width:100%; border-width:1px 0 0; border-radius:0; padding:24px 18px 44px; background:var(--panel-bg); }
      .scale-200 .phone { width:100%; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <main id="stage"></main>
  <script>
    // MODEL START
    const ROLE_INFO = {
      SB: { full:'스몰 블라인드 (SB)', note:'의무로 1칩을 내요' },
      BB: { full:'빅 블라인드 (BB)', note:'의무로 2칩을 내요' },
      UTG: { full:'언더 더 건 (UTG)', note:'BB 다음 첫 행동' },
      HJ: { full:'하이잭 (HJ)', note:'중간 자리' },
      CO: { full:'컷오프 (CO)', note:'딜러 바로 앞' },
      BTN: { full:'딜러 버튼 (BTN)', note:'딜러, 마지막 비블라인드' }
    };

    function rolesFor(count) {
      if (count === 3) return ['SB','BB','BTN'];
      if (count === 4) return ['SB','BB','UTG','BTN'];
      throw new RangeError('Only 3- and 4-player prototype scenarios are supported.');
    }

    function buildScenario(count) {
      const roles = rolesFor(count);
      const nonblinds = roles.filter(role => !['SB','BB'].includes(role));
      const opener = nonblinds[0];
      const callers = nonblinds.slice(1);
      const actions = [
        { actor:'SB', type:'post', amount:1 },
        { actor:'BB', type:'post', amount:2 },
        { actor:opener, type:'raiseTo', to:6 },
        ...callers.map(actor => ({ actor, type:'callTo', to:6 })),
        { actor:'SB', type:'fold' },
        { actor:'BB', type:'raiseTo', to:18 },
        { actor:opener, type:'callTo', to:18 }
      ];
      const expected = count === 3 ? 37 : 43;
      const choiceSets = { 3:[39,37,43], 4:[43,45,49] };
      return { count, roles, nonblinds, opener, callers, pending:callers, actions, expected, choices:choiceSets[count] };
    }

    function applyAction(contributions, action) {
      const next = { ...contributions };
      if (!action.actor) return next;
      const before = next[action.actor] || 0;
      if (action.type === 'post') next[action.actor] = before + action.amount;
      if (action.type === 'raiseTo' || action.type === 'callTo') next[action.actor] = action.to;
      return next;
    }

    function snapshot(scenario, frame) {
      let contributions = Object.fromEntries(scenario.roles.map(role => [role,0]));
      for (let i=0; i<=frame; i++) contributions = applyAction(contributions, scenario.actions[i]);
      const action = scenario.actions[frame];
      return { contributions, action, total:Object.values(contributions).reduce((sum,value)=>sum+value,0) };
    }

    function addedBy(scenario, frame) {
      const action = scenario.actions[frame];
      if (!action.actor || action.type === 'fold') return 0;
      const before = frame ? snapshot(scenario, frame-1).contributions[action.actor] : 0;
      return snapshot(scenario, frame).contributions[action.actor] - before;
    }

    function actionCaption(scenario, frame) {
      const action = scenario.actions[frame];
      if (action.type === 'post') return `${action.amount}칩 먼저 내요 · 블라인드`;
      if (action.type === 'fold') return '낸 1칩은 남아요 · 폴드';
      const added = addedBy(scenario, frame);
      if (action.type === 'raiseTo') return `${added}칩 더 내요 · 총 ${action.to}칩으로 레이즈`;
      return `${added}칩 더 내요 · 콜`;
    }

    function actorLabel(scenario, role) {
      if (role === 'SB') return '스몰 블라인드';
      if (role === 'BB') return '빅 블라인드';
      const index = scenario.nonblinds.indexOf(role);
      return `플레이어 ${String.fromCharCode(65 + index)}${role === 'BTN' ? ' · 딜러' : ''}`;
    }

    // MODEL END
  </script>
  <script>

    const PALETTES = new Set(['charcoal','slate','paper']);
    const requestedPalette = new URLSearchParams(window.location.search).get('palette');
    const ui = { count:4, frame:null, screen:'intro-first', selected:null, submitted:false, scale:false, reduced:false, help:false, palette:PALETTES.has(requestedPalette)?requestedPalette:'charcoal' };
    const stage = document.getElementById('stage');
    let activeMotions = [];

    function introMarkup(returning=false) {
      return `<section class="intro"><p class="kicker">${returning?'다시 온 연습':'처음 만나는 팟 계산'}</p><h2>${returning?'가운데 놓인 칩을<br>한 번씩 더해요':'팟을 알면 콜 가격을<br>판단할 수 있어요'}</h2><p>${returning?'레이즈 총액에는 앞서 낸 칩이 포함돼요. 좌석별로 낸 칩을 한 번씩 더해요.':'팟은 테이블 가운데 모인 칩의 합이에요. 누가 얼마를 냈는지 따라가면 같은 칩을 두 번 세지 않을 수 있어요.'}</p><div class="how"><strong>이렇게 확인해요</strong><p>스몰 블라인드는 1칩, 빅 블라인드는 2칩을 먼저 내요. 행동을 따라가며 총 레이즈와 이번 추가액을 구분해요. 마지막에 팟의 칩 수를 세 가지 답 중에서 골라요.</p></div><button class="primary" data-action="start">${returning?'바로 문제 풀기':'블라인드부터 보기'}</button>${returning?'<button class="text-button" data-action="full-intro">처음 소개 다시 보기</button>':''}</section>`;
    }

    function tableMarkup(scenario, frame) {
      const view = snapshot(scenario, frame);
      const action = view.action;
      const final = frame === scenario.actions.length - 1;
      const seats = scenario.roles.map((role,i) => {
        const active = action.actor === role;
        const contribution = view.contributions[role];
        const status = contribution === 0 ? '0칩' : `${contribution}칩`;
        const folded = scenario.actions.slice(0,frame+1).some(item => item.actor===role && item.type==='fold');
        const roleNote = folded ? '폴드 · 낸 1칩은 팟에 남아요' : role==='SB' ? 'SB · 먼저 1칩' : role==='BB' ? 'BB · 먼저 2칩' : contribution===0 ? '아직 행동 전' : role===scenario.opener ? '먼저 레이즈' : '콜';
        return `<article class="seat" data-seat="${role}" data-active="${active}"><span class="seat-order">${i+1}</span><span class="seat-name">${actorLabel(scenario,role)}</span><span class="seat-role">${roleNote}</span><div class="tray"><span class="tray-label">낸 칩</span><span class="tray-total">${status}</span></div><div class="seat-action">${active?actionCaption(scenario,frame):'&nbsp;'}</div></article>`;
      }).join('');
      const stopCue = final ? (scenario.pending.length ? '여기까지 센 팟 · 플레이어 B 다음 응답 전' : '여기까지 센 팟') : '팟은 답변 전까지 숨겨요';
      return `<section class="table" aria-label="${scenario.count}인 테이블"><div class="perimeter" data-count="${scenario.count}">${seats}<div class="pot-zone"><span>${stopCue}</span><strong>?</strong></div></div></section><section class="timeline"><div class="timeline-track" aria-label="행동 진행 ${frame+1}단계">${scenario.actions.map((_,i)=>`<i class="${i<frame?'past':i===frame?'current':''}"></i>`).join('')}</div><div class="timeline-controls"><button data-action="prev" aria-label="이전 행동" ${frame===0?'disabled':''}>이전</button><button data-action="next" aria-label="다음 행동" ${final?'disabled':''}>다음</button></div></section>`;
    }

    function questionMarkup() {
      const scenario = buildScenario(ui.count);
      const frame = ui.frame ?? scenario.actions.length - 1;
      const final = frame === scenario.actions.length - 1;
      const view = snapshot(scenario, frame);
      const choices = scenario.choices.map(value => `<button class="choice" data-action="choose" data-choice="${value}" aria-pressed="${ui.selected===value}" ${ui.submitted?'disabled':''}><strong>${value}칩</strong><span class="choice-mark" aria-hidden="true"></span></button>`).join('');
      const equation = scenario.roles.map(role => `${actorLabel(scenario,role)} ${view.contributions[role]}`).join(' + ');
      return `<section class="question"><div class="progress"><span>모형용 ${scenario.count}인 예시</span><span>한 문제</span></div><h2 class="question-title" tabindex="-1">지금 팟은 몇 칩일까요?</h2>${tableMarkup(scenario,frame)}${final?`<div class="choices" aria-label="답 선택">${choices}</div>${ui.submitted?`<div class="feedback" role="status"><h3 tabindex="-1" class="${ui.selected===scenario.expected?'correct':'wrong'}">${ui.selected===scenario.expected?'맞아요. 지금 팟은 '+scenario.expected+'칩이에요':'지금 팟은 '+scenario.expected+'칩이에요'}</h3><p>좌석별로 낸 칩을 한 번씩 더하면 돼요.</p><details class="calculation"><summary>계산 과정 보기</summary><p>${equation} = ${scenario.expected}</p>${scenario.pending.length?'<p>플레이어 B는 빅 블라인드가 금액을 다시 올린 뒤 아직 응답하지 않았어요.</p>':''}</details></div><div class="result-actions"><button class="secondary" data-action="retry">다시 풀기</button><button class="primary" data-action="new-example">새 예시 보기</button></div>`:`<button class="primary confirm" data-action="confirm" ${ui.selected===null?'disabled':''}>선택한 답 확인하기</button>`}`:''}</section>`;
    }

    function reviewMarkup() {
      const paletteLabels = { charcoal:['차콜 · 앰버','추천 · 초록은 테이블에만'], slate:['슬레이트 · 블루','차분한 중성 대비'], paper:['페이퍼 · 파인','밝은 학습지 대비'] };
      const palettes = [...PALETTES].map(key => `<button class="palette-choice" data-review-palette="${key}" aria-pressed="${ui.palette===key}"><span class="palette-swatches" aria-hidden="true"><i></i><i></i></span><span class="palette-copy"><strong>${paletteLabels[key][0]}</strong><small>${paletteLabels[key][1]}</small></span></button>`).join('');
      return `<aside class="review-panel"><p class="study-label">INTERACTIVE STUDY · 모형용 예시 · 출시용 아님</p><h2>Table + trays hybrid</h2><p>좌석별로 낸 칩과 현재 행동을 같은 테이블 안에서 확인해요.</p><div class="control-group"><span>팔레트 비교</span><div class="palette-grid">${palettes}</div></div><div class="control-group"><span>예시 인원수</span><div class="segmented">${[3,4].map(count=>`<button data-review-count="${count}" aria-pressed="${ui.count===count}">${count}인</button>`).join('')}</div></div><div class="control-group"><span>화면 상태</span><div class="review-list"><button class="review-action" data-review-screen="intro-first">첫 방문 소개</button><button class="review-action" data-review-screen="intro-returning">재방문 소개</button><button class="review-action" data-review-screen="question">문제</button><button class="review-action" data-action="text-scale">${ui.scale?'기본 글자 크기':'글자 200% 검토'}</button><button class="review-action" data-action="motion-toggle">${ui.reduced?'동작 효과 켜기':'동작 줄이기 검토'}</button></div></div></aside>`;
    }

    function helpMarkup() {
      if (!ui.help) return '';
      return `<div class="help-backdrop"><section class="help" role="dialog" aria-modal="true" aria-labelledby="help-title"><h2 id="help-title">용어와 계산</h2><p>SB는 스몰 블라인드, BB는 빅 블라인드예요. 블라인드는 카드가 나오기 전에 의무로 내는 칩이에요. 팟은 각 좌석이 가운데에 낸 총액의 합이에요. 4인 예시는 플레이어 B의 다음 응답 전에 멈춰요.</p><button class="primary" data-action="close-help" data-modal-close>도움말 닫기</button></section></div>`;
    }

    function render(focusSelector) {
      cancelMotions();
      if (document.documentElement) document.documentElement.dataset.palette=ui.palette;
      const content = ui.screen === 'intro-first' ? introMarkup(false) : ui.screen === 'intro-returning' ? introMarkup(true) : questionMarkup();
      stage.innerHTML = `<div class="review-shell ${ui.scale?'scale-200':''} ${ui.reduced?'reduce-motion':''}" data-palette="${ui.palette}"><div class="phone"><div class="app"><header class="app-header"><button class="icon-button" data-action="returning" aria-label="재방문 소개" ${ui.screen.startsWith('intro')?'hidden':''}>↶</button><div class="header-center"><p class="kicker">팟 계산 · 칩 단위</p><h1>Glass Table</h1></div><button class="icon-button" data-action="help" aria-label="도움말 열기">?</button></header><main class="lesson">${content}</main></div></div>${reviewMarkup()}${helpMarkup()}</div>`;
      if (focusSelector) requestAnimationFrame(() => stage.querySelector(focusSelector)?.focus({preventScroll:true}));
    }

    function cancelMotions() {
      activeMotions.forEach(({animation,node}) => { animation.cancel(); node.remove(); });
      activeMotions = [];
      stage.querySelectorAll('.motion-chip').forEach(node => node.remove());
    }

    function animateChipToPot() {
      if (ui.reduced || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const from = stage.querySelector('.seat[data-active="true"]');
      const to = stage.querySelector('.pot-zone');
      if (!from || !to) return;
      const a=from.getBoundingClientRect(), b=to.getBoundingClientRect();
      const node=document.createElement('span');
      node.className='motion-chip';
      node.setAttribute('aria-hidden','true');
      node.style.left=`${a.left+a.width/2-10}px`;
      node.style.top=`${a.top+a.height/2-5}px`;
      document.body.append(node);
      const dx=b.left+b.width/2-(a.left+a.width/2), dy=b.top+b.height/2-(a.top+a.height/2);
      const animation=node.animate([{transform:'translate(0,0)',opacity:.95},{transform:`translate(${dx}px,${dy}px)`,opacity:0}],{duration:220,easing:'cubic-bezier(0.77,0,0.175,1)',fill:'forwards'});
      const entry={animation,node}; activeMotions.push(entry);
      animation.finished.catch(()=>{}).finally(()=>{ node.remove(); activeMotions=activeMotions.filter(item=>item!==entry); });
    }

    stage.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) {
        if (event.target.classList.contains('help-backdrop')) { ui.help=false; render('[data-action="help"]'); }
        return;
      }
      const action = button.dataset.action;
      if (button.dataset.reviewPalette) {
        const palette=button.dataset.reviewPalette;
        if (!PALETTES.has(palette)) return;
        ui.palette=palette;
        const params=new URLSearchParams(window.location.search);
        params.set('palette',palette);
        window.history?.replaceState?.(null,'',`${window.location.pathname||''}?${params.toString()}${window.location.hash||''}`);
        render(`[data-review-palette="${palette}"]`);
        return;
      }
      if (button.dataset.reviewCount) { const count=Number(button.dataset.reviewCount); buildScenario(count); ui.count=count; ui.screen='question'; ui.frame=null; ui.selected=null; ui.submitted=false; render(`[data-review-count="${ui.count}"]`); return; }
      if (button.dataset.reviewScreen) { ui.screen=button.dataset.reviewScreen; ui.frame=null; ui.selected=null; ui.submitted=false; render(`[data-review-screen="${ui.screen}"]`); return; }
      if (action==='start') { const returning=ui.screen==='intro-returning'; ui.screen='question'; ui.frame=returning?null:0; ui.selected=null; ui.submitted=false; render('.question-title'); }
      else if (action==='full-intro') { ui.screen='intro-first'; render('[data-action="start"]'); }
      else if (action==='returning') { ui.screen='intro-returning'; render('[data-action="start"]'); }
      else if (action==='help') { ui.help=true; render('[data-modal-close]'); }
      else if (action==='close-help') { ui.help=false; render('[data-action="help"]'); }
      else if (action==='prev') { ui.frame=Math.max(0,(ui.frame??buildScenario(ui.count).actions.length-1)-1); render(ui.frame===0?'.question-title':'[data-action="prev"]'); }
      else if (action==='next') { const s=buildScenario(ui.count); ui.frame=Math.min(s.actions.length-1,(ui.frame??s.actions.length-1)+1); const moves=addedBy(s,ui.frame)>0; render(ui.frame===s.actions.length-1?'.question-title':'[data-action="next"]'); if(event.detail>0&&moves) requestAnimationFrame(animateChipToPot); }
      else if (action==='choose') { ui.selected=Number(button.dataset.choice); render(`[data-choice="${ui.selected}"]`); }
      else if (action==='confirm') { if (ui.selected!==null) { ui.submitted=true; render('.feedback h3'); } }
      else if (action==='retry') { ui.selected=null; ui.submitted=false; render('.choice'); }
      else if (action==='new-example') { ui.count=ui.count===3?4:3; ui.screen='question'; ui.frame=null; ui.selected=null; ui.submitted=false; render('.question-title'); }
      else if (action==='text-scale') { ui.scale=!ui.scale; render('[data-action="text-scale"]'); }
      else if (action==='motion-toggle') { ui.reduced=!ui.reduced; render('[data-action="motion-toggle"]'); }
    });

    document.addEventListener('keydown', event => {
      if (!ui.help) return;
      if (event.key==='Escape') { event.preventDefault(); ui.help=false; render('[data-action="help"]'); return; }
      if (event.key==='Tab') {
        const controls=[...stage.querySelectorAll('.help button:not([disabled])')];
        if (!controls.length) return;
        event.preventDefault();
        const current=controls.indexOf(document.activeElement);
        controls[(current+(event.shiftKey?-1:1)+controls.length)%controls.length].focus();
      }
    });

    window.GlassTablePotPrototype = { buildScenario, snapshot, addedBy, actionCaption };
    render();
  </script>
</body>
</html>
