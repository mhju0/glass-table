<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Table | Consistent learning prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="review-bar" aria-label="Prototype review controls">
    <span class="review-label">Scripted prototype</span>
    <div class="review-controls">
      <label>Language <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
      <label>Appearance <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>Text <select id="text-size"><option value="normal">Normal</option><option value="large">Large</option></select></label>
      <label>Design <select id="design"><option value="current">Current</option><option value="refined">Refined</option></select></label>
    </div>
  </aside>
  <div class="phone-frame">
    <main id="app" class="app" aria-live="polite"></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
