<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Current vs Refined</title>
  <style>
    :root{color-scheme:light;--page:#dcd8cf;--ink:#26312d;--sub:#53625c;--line:#b9b6ab;--surface:#f6f3ed}
    body{margin:0;background:var(--page);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif}
    header{max-width:820px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
    h1{font-size:16px;margin:0}
    .controls{display:flex;flex-wrap:wrap;gap:10px}
    .controls label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--sub)}
    select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px}
    main{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;padding:0 16px 32px}
    figure{margin:0}
    figcaption{font-weight:700;margin:0 0 8px}
    figcaption span{font-weight:400;color:var(--sub)}
    iframe{display:block;width:377px;max-width:calc(100vw - 32px);height:814px;border:1px solid var(--line);border-radius:26px;background:var(--surface)}
  </style>
</head>
<body>
  <header>
    <h1>Current vs Refined · synced</h1>
    <div class="controls">
      <label>Language <select id="lang"><option value="ko">한국어</option><option value="en">English</option></select></label>
      <label>Appearance <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>Text <select id="size"><option value="normal">Normal</option><option value="large">Large</option></select></label>
    </div>
  </header>
  <main>
    <figure><figcaption>Current <span>· original table and copy</span></figcaption><iframe id="current" title="Current design" src="index.html?design=current"></iframe></figure>
    <figure><figcaption>Refined <span>· new table, fitted copy</span></figcaption><iframe id="refined" title="Refined design" src="index.html?design=refined"></iframe></figure>
  </main>
  <script>
    // Both phones load the same prototype; any tap in one copies its screen state to the other.
    const frames = [...document.querySelectorAll('iframe')];
    const SHARED = ['mode','stage','step','answered','assisted','showSteps','exampleExpanded','introFromPractice','sessions'];
    const settings = () => ({lang: lang.value, theme: theme.value, size: size.value});
    let ready = 0;
    function apply(frame, patch) {
      frame.contentWindow.eval(`Object.assign(state, ${JSON.stringify(patch)}); render();`);
    }
    function mirror(from) {
      const snapshot = JSON.parse(from.contentWindow.eval(`JSON.stringify({${SHARED.map(k => `${k}: state.${k}`).join(',')}})`));
      frames.filter(f => f !== from).forEach(f => apply(f, snapshot));
    }
    frames.forEach(frame => frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      const style = doc.createElement('style');
      style.textContent = '.review-bar{display:none}.phone-frame{height:812px;min-height:0;margin:0;border:0;border-radius:25px;box-shadow:none;width:375px}';
      doc.head.append(style);
      ['click','keydown'].forEach(type => doc.addEventListener(type, () => setTimeout(() => mirror(frame)), false));
      apply(frame, settings());
      if (++ready === frames.length) mirror(frames[0]);
    }));
    [lang, theme, size].forEach(select => select.addEventListener('change', () => {
      frames.forEach(f => apply(f, settings()));
      document.documentElement.style.colorScheme = theme.value;
    }));
  </script>
</body>
</html>
