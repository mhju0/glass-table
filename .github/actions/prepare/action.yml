name: Prepare Xcode project
description: Select the newest Xcode, install XcodeGen and generate the project.
runs:
  using: composite
  steps:
    # The app compiles against iOS 26 API (sharedBackgroundVisibility in the nav
    # chrome), and #available guards runtime, not compile — the runner's default
    # Xcode builds with an older SDK and fails on the symbol. Pick the newest
    # installed Xcode and say which, so the next SDK mismatch is one log line away.
    - name: Select newest Xcode
      shell: bash
      run: |
        xcode_candidates=(/Applications/Xcode_*.app)
        sudo xcode-select -s "$(printf '%s\n' "${xcode_candidates[@]}" | sort -V | tail -1)"
        xcodebuild -version
    - name: Install XcodeGen
      shell: bash
      run: brew install xcodegen
    - name: Generate project
      shell: bash
      run: xcodegen generate
