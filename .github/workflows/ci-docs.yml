name: CI (docs)
# Required checks unit, focused-ui and release come from ci.yml, which skips these paths.
# This workflow reports the same three names for those PRs so they can merge.
# Docs-only PR: each job passes at once. PR that also changes other files: ci.yml runs too,
# and each job here waits for ci.yml's job of the same name and copies its result.
on:
  pull_request:
    paths: ['docs/**', '**/*.md', '.github/ISSUE_TEMPLATE/**']

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: .github/scripts }
      - run: .github/scripts/docs-check-mirror.sh unit
        env: { GH_TOKEN: "${{ github.token }}" }
  focused-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: .github/scripts }
      - run: .github/scripts/docs-check-mirror.sh focused-ui
        env: { GH_TOKEN: "${{ github.token }}" }
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: .github/scripts }
      - run: .github/scripts/docs-check-mirror.sh release
        env: { GH_TOKEN: "${{ github.token }}" }
