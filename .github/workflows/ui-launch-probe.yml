# Temporary provider validation. Retire after the one owned run is inspected.
name: UI observer provider probe
on:
  push:
    branches: ['fix/ci-observer-followup-20261022']
    paths: ['.github/workflows/ui-launch-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-observer-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-prefix:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify unchanged application and record exact source
        run: |
          git diff --exit-code 23f5383 HEAD -- GlassTable GlassTableDrills GlassTableEngine project.yml
          git rev-parse HEAD > provenance.txt
          git ls-files -z tools/ci_ui_observer.py tools/tests/test_ci_ui_observer.py GlassTable GlassTableDrills GlassTableEngine project.yml | xargs -0 shasum -a 256 > source-sha256.txt
      - name: Select and verify original Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version | tee -a provenance.txt
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.3'
          sw_vers >> provenance.txt
      - name: Check observer process boundaries
        run: python3 -m unittest discover -s tools/tests -p test_ci_ui_observer.py -v > ui-observer-tests.log 2>&1
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Observe unchanged original four-test prefix
        timeout-minutes: 35
        env:
          TEST_DEVICE: iPhone 17
          TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
        run: |
          test_simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["TEST_RUNTIME"], [])
          print(next((d["udid"] for d in devices if d["name"] == os.environ["TEST_DEVICE"]), ""))')
          test -n "$test_simulator" || { xcrun simctl list devices available; exit 1; }
          echo "$test_simulator" > probe-simulator.txt
          xcrun simctl list runtimes >> provenance.txt
          echo "Testing on $TEST_DEVICE ($TEST_RUNTIME) $test_simulator" >> provenance.txt
          status=0
          # Lower only the diagnostic trigger so the sampler is exercised without a stall.
          python3 tools/ci_ui_observer.py --simulator "$test_simulator" --launch-seconds 1 \
            --log launch-probe.log --diagnostics ui-tests-observer -- \
            xcodebuild -project GlassTable.xcodeproj -scheme GlassTable \
            -destination "platform=iOS Simulator,id=$test_simulator" \
            -only-testing:GlassTableUITests/AccessibilityFlowTests/testCountKeypadCanOpenAndCollapseAtAccessibilityXXXL \
            -only-testing:GlassTableUITests/AccessibilityFlowTests/testDefendRevealExposesSelectedEvidenceAndChartRowsAtAccessibilityXXXL \
            -only-testing:GlassTableUITests/AccessibilityFlowTests/testEquityAnswerCanBeSubmittedAtAccessibilityXXXL \
            -only-testing:GlassTableUITests/AccessibilityFlowTests/testEVRevealLeadsWithRangeEvidenceAndLossEquationAtAccessibilityXXXL \
            -resultBundlePath launch-probe.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 900 \
            CODE_SIGNING_ALLOWED=NO test || status=$?
          tail -100 launch-probe.log || true
          exit "$status"
      - name: Require retained host and scoped runner stacks
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('ui-tests-observer')
          events = [json.loads(line) for line in (root / 'timeline.jsonl').read_text().splitlines()]
          starts = {(e['round'], e['role']): e for e in events if e['event'] == 'sample_start'}
          retained = set()
          for event in events:
              if event['event'] != 'sample_finish' or not event['usable']:
                  continue
              start = starts[(event['round'], event['role'])]
              identity = start['identity']
              path = root / event['round'] / f"{event['role']}-{identity['pid']}.sample.txt"
              assert path.stat().st_size == event['retained_bytes'] > 0, event
              content = path.read_text(errors='replace')
              assert 'Call graph:' in content and 'Thread_' in content, f'Not a stack: {path}'
              if event['role'] in ('runner', 'app'):
                  simulator = pathlib.Path('probe-simulator.txt').read_text().strip()
                  executable = 'GlassTableUITests-Runner' if event['role'] == 'runner' else 'GlassTable'
                  assert f'/Devices/{simulator}/data/Containers/Bundle/Application/' in identity['command'], start
                  assert f'/{executable}.app/{executable}' in identity['command'], start
              retained.add(event['role'])
          assert {'host', 'runner'} <= retained, f'Missing required stacks: {retained}'
          app_verified = any(e['event'] == 'sample_start' and e['role'] == 'app' for e in events)
          if app_verified:
              assert 'app' in retained, 'A fresh selected-simulator app was sampled but no usable app stack survived'
          else:
              assert any(e['event'] == 'sample_skipped' and e.get('role') == 'app' for e in events), 'Missing explicit app-absence diagnostics'
          print('Retained real provider stacks:', sorted(retained))
          PY
      - name: Retain provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-observer-provider-probe
          path: |
            provenance.txt
            source-sha256.txt
            probe-simulator.txt
            ui-observer-tests.log
            launch-probe.log
            launch-probe.xcresult
            ui-tests-observer
