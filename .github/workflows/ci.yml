name: CI
# Documentation-only changes skip CI (D60): they cannot change the app, and main has
# no required checks, so a skipped run does not hold a pull request.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three jobs run side by side (D60); the focused UI flows set the wall time.
jobs:
  unit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - name: Gate (unit)
        run: scripts/check.sh --part unit
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-logs
          path: app-tests.log

  focused-ui:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - name: Gate (focused-ui)
        env:
          TEST_DEVICE: iPhone 17
          TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
        run: scripts/check.sh --part focused-ui
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focused-ui-logs
          path: |
            focused-ui.log
            focused-ui.xcresult

  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - name: Gate (release)
        run: scripts/check.sh --part release
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            release-build.log
            release-smoke.log
