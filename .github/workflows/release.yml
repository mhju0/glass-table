# Pushing a tag like v1.0-29 archives that commit and uploads it to TestFlight.
# The tag must name the version and build in project.yml and point at a commit on
# main. Setup and secrets: docs/ci-cd.md.
name: TestFlight
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Require signing secrets
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/ci-cd.md."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main."; exit 1; }
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Require the tag to match the version and build
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw GlassTable/Info.plist)
          build=$(plutil -extract CFBundleVersion raw GlassTable/Info.plist)
          if [ "$GITHUB_REF_NAME" != "v$version-$build" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project.yml (expected v$version-$build)."
            exit 1
          fi
      - name: Install the App Store Connect key
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          xcodebuild -project GlassTable.xcodeproj -scheme GlassTable \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GlassTable.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive > archive.log 2>&1 || { tail -150 archive.log; exit 1; }
          tail -5 archive.log
      - name: Verify distributable contents
        run: python3 tools/verify_release.py "$RUNNER_TEMP/GlassTable.xcarchive/Products/Applications/GlassTable.app"
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GlassTable.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 || { tail -150 export.log; exit 1; }
          tail -10 export.log
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
