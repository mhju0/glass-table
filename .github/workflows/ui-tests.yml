# The full UI flow suite, too slow for every push. Runs when app code reaches `main`,
# and by hand (run it on the release commit before a TestFlight tag). Re-testing an
# unchanged commit finds only simulator flakiness, so there is no schedule.
# Test classes are split across four shards by measured minutes; a new class runs
# without a workflow edit. UXAuditCrawl skips itself without GT_AUDIT_OUT. A pull
# request that changes this file runs it too, so a workflow edit is proven before it merges.
name: UI tests
on:
  # Paths filters are not applied to tag pushes, so without `branches` every release tag
  # started a full UI run.
  push:
    branches: [main]
    paths:
      - 'GlassTable/**'
      - 'GlassTableEngine/Sources/**'
      - 'GlassTableDrills/Sources/**'
      - 'project.yml'
      - 'tools/ci_ui_observer.py'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    paths: ['.github/workflows/ui-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: macos-15
    # Runner speed varies about 2x: one four-shard run took 47 to 117 min per shard. A job
    # killed at its limit uploads no evidence, so the test step stops first and the upload
    # below still runs. A hung test is stopped after 15 min (the longest seen took under 6).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Check UI observer process boundaries
        run: |
          status=0
          python3 -m unittest discover -s tools/tests -p test_ci_ui_observer.py -v > ui-observer-tests.log 2>&1 || status=$?
          cat ui-observer-tests.log || true
          exit "$status"
      # Shards are balanced by measured minutes per class on a GitHub runner (single pass
      # of run 41166542595, read from the ui-observer artifact's timeline.jsonl). A class
      # not in the table is estimated from its test count, so a new
      # class still runs; add its measured minutes here once a run has shown them.
      - name: Pick this shard's test classes
        run: |
          python3 - "${{ matrix.shard }}" > only-testing.txt <<'EOF'
          import pathlib, re, sys
          shard, shards = int(sys.argv[1]), 4
          minutes = {
              'BilingualConsistencyB20Tests': 55, 'FreeTableBackFlowTests': 26,
              'BestFiveComparisonTests': 20, 'AccessibilityFlowTests': 11,
              'BeginnerReleaseTests': 11, 'LearningFlowTests': 11,
              'FinalPresentationVerificationTests': 10, 'WelcomeFirstFlowTests': 10,
              'ChartFirstUseFlowTests': 8, 'FreeTableMotionFlowTests': 8,
              'LearningReferenceFlowTests': 8, 'LearningOrderChenStepRowTests': 7,
              'RestoredPresentationTests': 6, 'FreeDockFlowTests': 5,
              'BasicsGuidedHandInvitationTests': 4, 'FreeRaiseFlowTests': 4,
              'GuidedHandFlowTests': 4, 'StepLevelsReadingTests': 4,
              'DeviceFeedbackLessonTests': 3, 'LearnListTests': 3,
              'PlayListTests': 3, 'ProgressTabTests': 3,
              'QuickPlayArchiveFlowTests': 3, 'AccessibilityAuditTests': 2,
              'AppearanceFlowTests': 2, 'BottomPanelB22Tests': 2,
              'DeviceFeedbackSettingsTests': 2, 'FirstLessonFeedbackFlowTests': 2,
              'GradedLearningFlowTests': 2, 'NativeRefinementTests': 2,
              'NavigationChromeTests': 2, 'NumericalRevealFlowTests': 2,
              'ReviewTeachingFollowupTests': 2, 'StepLevelsMathTests': 2,
              'StepLevelsTests': 2, 'TerminologyLearningFlowTests': 2,
              'DeviceFeedbackBoundsTests': 1, 'GradedDockFlowTests': 1,
              'GradedTableRecoveryFlowTests': 1, 'LargestTextCapTests': 1,
              'NumericalRecordsFlowTests': 1, 'OutsRevealTests': 1,
              'ReleaseSmokeTests': 1, 'RestoredLessonParityFlowTests': 1,
              'UXAuditCrawl': 0,
          }
          classes, declared = {}, 0
          for path in sorted(pathlib.Path('GlassTable/UITests').glob('*.swift')):
              text = path.read_text()
              declared += len(re.findall(r'\bclass\s+\w+\s*:\s*XCTestCase\b', text))
              for name in re.findall(r'^\s*(?:@\w+\s+)*(?:final\s+)?class\s+(\w+)\s*:\s*XCTestCase\b', text, re.M):
                  classes[name] = minutes.get(name, 0.75 * len(re.findall(r'func test\w*\(', text)))
          loads = [0] * shards
          picked = [[] for _ in range(shards)]
          for name in sorted(classes, key=lambda n: (-classes[n], n)):
              i = loads.index(min(loads))
              loads[i] += classes[name]
              picked[i].append(name)
          # Every class must land in exactly one shard, or it would silently never run.
          assigned = [name for names in picked for name in names]
          if declared != len(classes) or sorted(assigned) != sorted(classes):
              print(f'::error::{declared} XCTestCase classes declared, {len(classes)} found, '
                    f'{len(assigned)} assigned; fix the class pattern above', file=sys.stderr)
              sys.exit(1)
          for name in sorted(set(classes) - set(minutes)):
              print(f'::warning::{name} has no measured minutes; estimated {classes[name]:.0f}', file=sys.stderr)
          for name in sorted(set(minutes) - set(classes)):
              print(f'::warning::{name} is in the minutes table but not in GlassTable/UITests', file=sys.stderr)
          for i in range(shards):
              print(f'shard {i}: about {loads[i]:.0f} min, {len(picked[i])} classes', file=sys.stderr)
          for name in sorted(picked[shard]):
              print(f'-only-testing:GlassTableUITests/{name}')
          EOF
          cat only-testing.txt
      # Layout assertions depend on the screen size, so the device and OS are pinned
      # rather than taking whichever iPhone is listed first. The macos-15 image lists
      # iPhone 17 under iOS 26.0.1, 26.1 and 26.2; raise this when the image moves on.
      - name: Run UI tests
        timeout-minutes: 165
        env:
          TEST_DEVICE: iPhone 17
          TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
        run: |
          test_simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["TEST_RUNTIME"], [])
          print(next((d["udid"] for d in devices if d["name"] == os.environ["TEST_DEVICE"]), ""))')
          if [ -z "$test_simulator" ]; then
            echo "::error::No available '$TEST_DEVICE' simulator on $TEST_RUNTIME. Installed:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on $TEST_DEVICE ($TEST_RUNTIME) $test_simulator"
          run() {  # $1 = name for log, observer and result bundle; then xcodebuild arguments
            name=$1; shift
            python3 tools/ci_ui_observer.py --simulator "$test_simulator" \
              --log "$name.log" --diagnostics "$name-observer" -- \
              xcodebuild -project GlassTable.xcodeproj -scheme GlassTable \
              -destination "platform=iOS Simulator,id=$test_simulator" \
              -resultBundlePath "$name.xcresult" \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 900 \
              CODE_SIGNING_ALLOWED=NO "$@"
          }
          status=0
          run ui-tests $(cat only-testing.txt) test || status=$?
          [ "$status" -eq 0 ] && { tail -30 ui-tests.log || true; exit 0; }
          # One retry per failed test (D57), not of the whole shard: xcodebuild's own
          # -retry-tests-on-failure re-ran every class in the shard (run 41166542595).
          failed=$(sed -nE "s/^Test Case '-\[GlassTableUITests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]' failed .*/\1\/\2/p" ui-tests.log | sort -u)
          grep -E "error: -\[|^Test Case .* failed \(" ui-tests.log | sed 's/^/::warning::First attempt: /' || true
          if [ -z "$failed" ]; then
            tail -200 ui-tests.log || true
            echo "::error::xcodebuild failed ($status) before any test failed"
            exit "$status"
          fi
          status=0
          run ui-tests-retry $(printf -- '-only-testing:GlassTableUITests/%s ' $failed) test-without-building || status=$?
          if [ "$status" -ne 0 ]; then
            tail -200 ui-tests-retry.log || true
            grep -E "error: -\[|^Test Case .* failed \(" ui-tests-retry.log | sed 's/^/::error::/' || true
            exit "$status"
          fi
          tail -30 ui-tests-retry.log || true
          # A test that failed once and passed on its retry is flaky: name it, don't fail.
          printf '%s\n' $failed | sed 's/^/::warning::Flaky, passed on retry: /'
      - name: Retain failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-shard-${{ matrix.shard }}
          path: |
            ui-tests.log
            ui-tests.xcresult
            ui-tests-retry.log
            ui-tests-retry.xcresult
      - name: Retain bounded observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-observer-shard-${{ matrix.shard }}
          path: |
            ui-tests-observer
            ui-tests-retry-observer
            ui-observer-tests.log
