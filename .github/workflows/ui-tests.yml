# The full UI flow suite, too slow for every push (D62). Runs nightly on `main` and by
# hand; a TestFlight tag needs a passing run on its commit (release.yml checks).
# Test classes are split across five shards by measured minutes; a new class runs
# without a workflow edit. UXAuditCrawl skips itself without GT_AUDIT_OUT. A pull
# request that changes this file runs it too, so a workflow edit is proven before it merges.
name: UI tests
on:
  schedule:
    - cron: '0 18 * * *'   # daily 18:00 UTC = 03:00 KST
  pull_request:
    paths: ['.github/workflows/ui-tests.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: read   # the retry allowlist is checked against open flaky-test issues (D63)

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A failed test is retried only if .github/flaky-tests.txt lists it with an open
  # flaky-test issue (D63). Checked once, before any macOS runner starts: a listed test that
  # no longer exists, or an issue that is closed or unlabelled, fails the run.
  flaky-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.check.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the retry allowlist against open flaky-test issues
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tests=$(python3 tools/ci_flaky_allowlist.py check --repo "$GITHUB_REPOSITORY")
          echo "Retry-eligible: ${tests:-none}"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  ui-tests:
    needs: flaky-allowlist
    runs-on: macos-26
    # Runner speed varies about 2x: one four-shard run took 47 to 117 min per shard. A job
    # killed at its limit uploads no evidence, so the test step stops first and the upload
    # below still runs. A hung test is stopped after 15 min (the longest seen took under 6).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - name: Check UI observer process boundaries
        run: |
          status=0
          python3 -m unittest discover -s tools/tests -p test_ci_ui_observer.py -v > ui-observer-tests.log 2>&1 || status=$?
          cat ui-observer-tests.log || true
          exit "$status"
      # Weights are the summed test-case minutes from run 45156656980
      # (first attempts in the ui-observer timelines). A class
      # not in the table is estimated from its test count, so a new
      # class still runs; add its measured minutes here once a run has shown them.
      - name: Pick this shard's test classes
        run: |
          python3 - "${{ strategy.job-index }}" "${{ strategy.job-total }}" > only-testing.txt <<'EOF'
          import pathlib, re, sys
          shard, shards = map(int, sys.argv[1:])
          minutes = {
              'BilingualConsistencyB20Tests': 71.8, 'BestFiveComparisonTests': 45.3,
              'FreeTableBackFlowTests': 31.2, 'LearningFlowTests': 18.3, 'BeginnerReleaseTests': 16.8,
              'AccessibilityFlowTests': 16.0, 'FinalPresentationVerificationTests': 16.0,
              'WelcomeFirstFlowTests': 14.7, 'BasicsGuidedHandInvitationTests': 11.6,
              'PairLessonFlowTests': 11.3, 'ChartFirstUseFlowTests': 10.1,
              'RestoredPresentationTests': 10.0, 'LearningReferenceFlowTests': 9.9,
              'FreeTableMotionFlowTests': 9.6, 'TableCourseFlowTests': 8.3, 'FreeDockFlowTests': 7.6,
              'LearningOrderChenStepRowTests': 6.5, 'StepLevelsReadingTests': 6.1,
              'UnitAFlowTests': 5.7, 'LearnListTests': 5.6, 'GuidedHandFlowTests': 5.4,
              'FreeRaiseFlowTests': 5.3, 'BottomPanelB22Tests': 4.9, 'CourseReviewFlowTests': 4.6,
              'ExpandedCourseFlowTests': 4.5, 'ReviewTeachingFollowupTests': 4.4,
              'ProgressTabTests': 4.3, 'QuickPlayArchiveFlowTests': 4.3, 'AccessibilityAuditTests': 4.2,
              'DeviceFeedbackLessonTests': 4.0, 'StepLevelsMathTests': 3.8, 'PlayListTests': 3.7,
              'AppearanceFlowTests': 3.7, 'StepLevelsTests': 3.5, 'OutsRevealTests': 3.4,
              'UnitBFlowTests': 3.4, 'TerminologyLearningFlowTests': 3.1, 'NativeRefinementTests': 2.9,
              'FirstLessonFeedbackFlowTests': 2.8, 'GradedLearningFlowTests': 2.7,
              'AdvancedElectiveFlowTests': 2.5, 'RestoredLessonParityFlowTests': 2.4,
              'NavigationChromeTests': 2.4, 'DeviceFeedbackSettingsTests': 2.3,
              'NumericalRevealFlowTests': 2.0, 'LargestTextCapTests': 1.7,
              'GradedTableRecoveryFlowTests': 1.3, 'GradedDockFlowTests': 1.2,
              'DeviceFeedbackBoundsTests': 1.1, 'NumericalRecordsFlowTests': 1.1,
              'RatingNoticeFlowTests': 0.8, 'ReleaseSmokeTests': 0.8, 'UXAuditCrawl': 0.0,
          }
          classes, declared = {}, 0
          for path in sorted(pathlib.Path('GlassTable/UITests').glob('*.swift')):
              text = path.read_text()
              declared += len(re.findall(r'\bclass\s+\w+\s*:\s*XCTestCase\b', text))
              for name in re.findall(r'^\s*(?:@\w+\s+)*(?:final\s+)?class\s+(\w+)\s*:\s*XCTestCase\b', text, re.M):
                  classes[name] = minutes.get(name, 0.75 * len(re.findall(r'func test\w*\(', text)))
          loads = [0] * shards
          picked = [[] for _ in range(shards)]
          for name in sorted(classes, key=lambda n: (-classes[n], n)):
              i = loads.index(min(loads))
              loads[i] += classes[name]
              picked[i].append(name)
          # Every class must land in exactly one shard, or it would silently never run.
          assigned = [name for names in picked for name in names]
          if not all(picked):
              sys.exit("::error::A UI shard has no test classes assigned.")
          if declared != len(classes) or sorted(assigned) != sorted(classes):
              print(f'::error::{declared} XCTestCase classes declared, {len(classes)} found, '
                    f'{len(assigned)} assigned; fix the class pattern above', file=sys.stderr)
              sys.exit(1)
          for name in sorted(set(classes) - set(minutes)):
              print(f'::warning::{name} has no measured minutes; estimated {classes[name]:.0f}', file=sys.stderr)
          for name in sorted(set(minutes) - set(classes)):
              print(f'::warning::{name} is in the minutes table but not in GlassTable/UITests', file=sys.stderr)
          for i in range(shards):
              print(f'shard {i}: about {loads[i]:.0f} min, {len(picked[i])} classes', file=sys.stderr)
          for name in sorted(picked[shard]):
              print(f'-only-testing:GlassTableUITests/{name}')
          EOF
          cat only-testing.txt
      # Layout assertions depend on the screen size, so the device and OS are pinned
      # rather than taking whichever iPhone is listed first. The macos-26 image lists
      # iPhone 17 under iOS 26.2, 26.4 and 26.5; raise this when the image moves on.
      - name: Run UI tests
        timeout-minutes: 165
        env:
          TEST_DEVICE: iPhone 17
          TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
          FLAKY_ALLOWED: ${{ needs.flaky-allowlist.outputs.tests }}
        run: |
          test_simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["TEST_RUNTIME"], [])
          print(next((d["udid"] for d in devices if d["name"] == os.environ["TEST_DEVICE"]), ""))')
          if [ -z "$test_simulator" ]; then
            echo "::error::No available '$TEST_DEVICE' simulator on $TEST_RUNTIME. Installed:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on $TEST_DEVICE ($TEST_RUNTIME) $test_simulator"
          run() {  # $1 = name for log, observer and result bundle; then xcodebuild arguments
            name=$1; shift
            python3 tools/ci_ui_observer.py --simulator "$test_simulator" \
              --log "$name.log" --diagnostics "$name-observer" -- \
              xcodebuild -project GlassTable.xcodeproj -scheme GlassTable \
              -destination "platform=iOS Simulator,id=$test_simulator" \
              -resultBundlePath "$name.xcresult" \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 900 \
              CODE_SIGNING_ALLOWED=NO "$@"
          }
          status=0
          run ui-tests $(cat only-testing.txt) test || status=$?
          [ "$status" -eq 0 ] && { tail -30 ui-tests.log || true; exit 0; }
          # One retry per failed test, not of the whole shard (D57): xcodebuild's own
          # -retry-tests-on-failure re-ran every class in the shard (run 41166542595).
          # Only tests on the flaky-test allowlist are retried (D63).
          failed=$(sed -nE "s/^Test Case '-\[GlassTableUITests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]' failed .*/\1\/\2/p" ui-tests.log | sort -u)
          grep -E "error: -\[|^Test Case .* failed \(" ui-tests.log | sed 's/^/::warning::First attempt: /' || true
          if [ -z "$failed" ]; then
            tail -200 ui-tests.log || true
            echo "::error::xcodebuild failed ($status) before any test failed"
            exit "$status"
          fi
          not_retried=$(printf '%s\n' $failed | python3 tools/ci_flaky_allowlist.py split)
          if [ -n "$not_retried" ]; then
            tail -200 ui-tests.log || true
            printf '%s\n' $not_retried | sed 's/^/::error::Failed; not retried because .github\/flaky-tests.txt does not list it with an open flaky-test issue: /'
            exit "$status"
          fi
          status=0
          run ui-tests-retry $(printf -- '-only-testing:GlassTableUITests/%s ' $failed) test-without-building || status=$?
          if [ "$status" -ne 0 ]; then
            tail -200 ui-tests-retry.log || true
            grep -E "error: -\[|^Test Case .* failed \(" ui-tests-retry.log | sed 's/^/::error::/' || true
            exit "$status"
          fi
          tail -30 ui-tests-retry.log || true
          # A test that failed once and passed on its retry is flaky: name it, don't fail.
          printf '%s\n' $failed | sed 's/^/::warning::Flaky, passed on retry: /'
      - name: Retain failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-shard-${{ strategy.job-index }}
          path: |
            ui-tests.log
            ui-tests.xcresult
            ui-tests-retry.log
            ui-tests-retry.xcresult
      - name: Retain bounded observer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-observer-shard-${{ strategy.job-index }}
          path: |
            ui-tests-observer
            ui-tests-retry-observer
            ui-observer-tests.log
