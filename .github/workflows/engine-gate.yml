# The engine correctness gate runs in release config (debug is impractically slow).
# Runs before engine changes merge, and weekly to detect toolchain drift.
name: Engine gate
on:
  push:
    branches: [main]
    paths: ['GlassTableEngine/**', '.github/workflows/engine-gate.yml']
  pull_request:
    paths: ['GlassTableEngine/**', '.github/workflows/engine-gate.yml']
  schedule:
    - cron: '0 20 * * 0'   # Sundays 20:00 UTC = Monday 05:00 KST
  workflow_dispatch:

jobs:
  engine-release-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Engine tests (release)
        run: swift test -c release --package-path GlassTableEngine
